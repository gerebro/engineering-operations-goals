<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ============================================================
   EDIT YOUR GOALS HERE — everything below <script id="goal-data">
   is the only part you need to touch to update this dashboard.
   ============================================================ */

:root{
  --paper: #e9ede9;
  --panel: #ffffff;
  --ink: #1f2a24;
  --ink-soft: #55645b;
  --hairline: #d3dad2;

  --on-track: #3f8f6b;
  --on-track-bg: #e6f2ec;
  --at-risk: #d98f3c;
  --at-risk-bg: #faf0e0;
  --blocked: #c24b4b;
  --blocked-bg: #f8e8e6;
  --done: #5b6b8c;
  --done-bg: #eaedf3;
}

*{ box-sizing: border-box; }

html, body{
  margin:0;
  padding:0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Work Sans', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap{
  max-width: 1080px;
  margin: 0 auto;
  padding: 48px 32px 80px;
}

/* ---------- Header ---------- */

header{
  margin-bottom: 44px;
}

.eyebrow-row{
  display:flex;
  align-items:baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 8px;
}

h1{
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 2.4rem;
  margin: 0;
  letter-spacing: -0.01em;
}

.updated{
  font-size: 0.85rem;
  color: var(--ink-soft);
}

.subtitle{
  font-size: 1.02rem;
  color: var(--ink-soft);
  max-width: 640px;
  line-height: 1.5;
  margin: 6px 0 0;
}

.summary-row{
  display:grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 16px;
  margin-top: 28px;
}

.summary-group{
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  padding: 16px 18px 18px;
}

.summary-group-label{
  color: var(--ink-soft);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.summary-group-stats{
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}

.summary-group.progress .summary-group-stats{
  grid-template-columns: repeat(3, 1fr);
}

.summary-stat{
  min-width: 0;
}

.summary-stat .num{
  font-family: 'Fraunces', serif;
  font-size: 2rem;
  font-weight: 500;
  line-height: 1;
}

.summary-stat .label{
  font-size: 0.82rem;
  color: var(--ink-soft);
  margin-top: 4px;
  line-height: 1.25;
}

.summary-stat.on-track .num{ color: var(--on-track); }
.summary-stat.at-risk .num{ color: var(--at-risk); }
.summary-stat.blocked .num{ color: var(--blocked); }
.summary-stat.done .num{ color: var(--done); }
.summary-stat.not-started .num{ color: var(--ink-soft); }
.summary-stat.in-progress .num{ color: var(--on-track); }
.summary-stat.sub-goals .num{ color: var(--ink-soft); }
.summary-stat.sub-goals-in-progress .num{ color: var(--on-track); }
.summary-stat.sub-goals-done .num{ color: var(--done); }

.edit-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 12px;
  margin: 18px 0 16px;
}

.edit-toolbar-actions{ display:flex; gap:8px; }

.edit-button{
  border: 1px solid var(--ink);
  border-radius: 4px;
  background: var(--ink);
  color: white;
  font: inherit;
  font-size: 0.78rem;
  padding: 8px 12px;
  cursor: pointer;
}

.edit-button.secondary{
  background: transparent;
  color: var(--ink);
}

.edit-button:disabled{ opacity: 0.45; cursor: not-allowed; }

.edit-field,
.edit-select{
  width:100%;
  border: 1px solid var(--hairline);
  border-radius: 3px;
  background: var(--panel);
  color: var(--ink);
  font: inherit;
  font-size: 0.86rem;
  padding: 7px 8px;
}

.edit-field.goal-name-input{ font-family: 'Fraunces', serif; font-size: 1.1rem; }
.edit-select{ width:auto; padding: 4px 6px; }
.goal-status-select{ font-weight: 500; }
.goal-status-select.status-done{ color: var(--done); border-color: var(--done); }
.goal-status-select.status-in-progress{ color: var(--on-track); border-color: var(--on-track); }
.goal-status-select.status-at-risk{ color: var(--at-risk); border-color: var(--at-risk); }
.goal-status-select.status-blocked{ color: var(--blocked); border-color: var(--blocked); }
.edit-milestone{ align-items:flex-start; }
.edit-milestone .step-name{ padding-top: 4px; }
.remove-step{
  border: none;
  background: transparent;
  color: var(--blocked);
  font: inherit;
  font-size: 0.75rem;
  padding: 5px 0;
  cursor: pointer;
}

.add-step{
  border: 1px dashed var(--hairline);
  border-radius: 3px;
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 0.78rem;
  padding: 7px 10px;
  cursor: pointer;
  margin-top: 10px;
}

.editor-section-label{
  color: var(--ink-soft);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 4px 0 10px;
}

.comments-section{
  margin-top: 44px;
}

.comments-heading{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.comments-heading h2{
  font-family: 'Fraunces', serif;
  font-size: 1.35rem;
  font-weight: 500;
  margin: 0;
}

.comments-heading span{
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.comment-form{
  display:grid;
  grid-template-columns: 1.1fr 0.55fr;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  padding: 16px;
}

.comment-form textarea{ min-height: 76px; resize: vertical; grid-column: 1 / -1; }
.comment-form .edit-button{ justify-self:start; }

.comments-list{
  display:grid;
  gap: 10px;
  margin-top: 12px;
}

.comment-entry{
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-left: 3px solid var(--on-track);
  border-radius: 4px;
  padding: 13px 16px;
}

.comment-meta{
  display:flex;
  justify-content:space-between;
  gap: 12px;
  color: var(--ink-soft);
  font-size: 0.74rem;
  margin-bottom: 7px;
}

.comment-related{ font-weight: 600; color: var(--ink); }
.comment-text{ white-space: pre-wrap; line-height: 1.5; font-size: 0.88rem; }
.comment-actions{ display:flex; gap: 10px; margin-top: 9px; }
.comment-actions button{ border: none; background: transparent; color: var(--ink-soft); cursor: pointer; font: inherit; font-size: 0.74rem; padding: 0; }
.comment-actions button:last-child{ color: var(--blocked); }
.comments-empty{ color: var(--ink-soft); font-size: 0.84rem; padding: 6px 0; }

/* ---------- Quarterly rail ---------- */

.rail-section{
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  padding: 28px 28px 20px;
  margin-bottom: 44px;
}

.rail-title{
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink-soft);
  margin: 0 0 18px;
}

.rail-title span{
  color: var(--ink-soft);
  font-size: 0.76rem;
  font-weight: 400;
  margin-left: 8px;
}

.rail-track{
  position: relative;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  column-gap: 0;
  padding-top: 6px;
}

.rail-line{
  position: absolute;
  top: 22px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--hairline);
}

.rail-quarter{
  position: relative;
  padding: 42px 10px 8px;
  text-align: left;
  border-left: 1px solid var(--hairline);
}

.rail-quarter:first-child{ border-left: none; }

.quarter-label{
  position: absolute;
  top: 0;
  left: 10px;
  font-size: 0.82rem;
  color: var(--ink-soft);
  font-weight: 500;
}

.quarter-count{
  display:block;
  color: var(--ink-soft);
  font-size: 0.68rem;
  font-weight: 400;
  margin-top: 3px;
}

.rail-stop{
  display:flex;
  align-items:flex-start;
  gap: 6px;
  background: var(--panel);
  border: 1.5px solid var(--hairline);
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 0.72rem;
  margin: 0 0 8px;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.1s ease;
  max-width: calc(100% - 12px);
}

.rail-stop:hover{ transform: translateY(-1px); }

.rail-stop .dot{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.rail-stop span.name{
  display:block;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  line-clamp: 2;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.rail-stop .stop-info{ min-width:0; }
.rail-stop .stop-status{
  display:none;
}

.rail-stop.status-on-track{ border-color: var(--on-track); }
.rail-stop.status-on-track .dot{ background: var(--on-track); }
.rail-stop.status-in-progress{ border-color: var(--on-track); }
.rail-stop.status-in-progress .dot{ background: var(--on-track); }
.rail-stop.status-at-risk{ border-color: var(--at-risk); }
.rail-stop.status-at-risk .dot{ background: var(--at-risk); }
.rail-stop.status-blocked{ border-color: var(--blocked); }
.rail-stop.status-blocked .dot{ background: var(--blocked); }
.rail-stop.status-done{ border-color: var(--done); }
.rail-stop.status-done .dot{ background: var(--done); }
.rail-stop.status-not-started{ border-color: var(--hairline); }
.rail-stop.status-not-started .dot{ background: var(--hairline); }

.rail-stops-wrap{
  min-height: 40px;
}

/* ---------- Goal cards ---------- */

.goals-heading{
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink-soft);
  margin: 0 0 16px;
}

.goal-card{
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-left: 4px solid var(--hairline);
  border-radius: 4px;
  margin-bottom: 14px;
  overflow: hidden;
}

.goal-card.status-on-track{ border-left-color: var(--on-track); }
.goal-card.status-at-risk{ border-left-color: var(--at-risk); }
.goal-card.status-blocked{ border-left-color: var(--blocked); }
.goal-card.status-done{ border-left-color: var(--done); }

.goal-head{
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 22px;
  cursor: pointer;
}

.goal-head-left{
  display:flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.goal-name{
  font-family: 'Fraunces', serif;
  font-size: 1.2rem;
  font-weight: 500;
}

.goal-meta{
  font-size: 0.8rem;
  color: var(--ink-soft);
  display:flex;
  gap: 10px;
  align-items:center;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 500;
  white-space: nowrap;
}

.badge .dot{ width:6px; height:6px; border-radius:50%; }

.badge.status-on-track{ background: var(--on-track-bg); color: var(--on-track); }
.badge.status-on-track .dot{ background: var(--on-track); }
.badge.status-at-risk{ background: var(--at-risk-bg); color: var(--at-risk); }
.badge.status-at-risk .dot{ background: var(--at-risk); }
.badge.status-blocked{ background: var(--blocked-bg); color: var(--blocked); }
.badge.status-blocked .dot{ background: var(--blocked); }
.badge.status-done{ background: var(--done-bg); color: var(--done); }
.badge.status-done .dot{ background: var(--done); }
.badge.status-in-progress{ background: var(--on-track-bg); color: var(--on-track); }
.badge.status-in-progress .dot{ background: var(--on-track); }

.goal-head-right{
  display:flex;
  align-items:center;
  gap: 18px;
  flex-shrink: 0;
}

.progress-mini{
  width: 120px;
}

.progress-track{
  height: 6px;
  background: var(--hairline);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill{
  height: 100%;
  border-radius: 4px;
}

.progress-pct{
  font-size: 0.76rem;
  color: var(--ink-soft);
  margin-top: 4px;
  text-align: right;
}

.chevron{
  width: 10px;
  height: 10px;
  border-right: 2px solid var(--ink-soft);
  border-bottom: 2px solid var(--ink-soft);
  transform: rotate(45deg);
  transition: transform 0.2s ease;
  flex-shrink: 0;
}

.goal-card.open .chevron{ transform: rotate(-135deg); }

.goal-body{
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease;
  border-top: 1px solid transparent;
}

.goal-card.open .goal-body{
  border-top: 1px solid var(--hairline);
}

.steps-list{
  padding: 6px 22px 18px;
}

.step{
  display:flex;
  align-items:center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 0.9rem;
}

.step:last-child{ border-bottom: none; }

.step-check{
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--hairline);
  flex-shrink: 0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.step.status-done .step-check{
  background: var(--done);
  border-color: var(--done);
}

.step.status-done .step-check::after{
  content: '';
  width: 4px;
  height: 7px;
  border-right: 1.5px solid white;
  border-bottom: 1.5px solid white;
  transform: rotate(45deg) translate(-1px,-1px);
}

.step-status-select{
  border: 1px solid var(--hairline);
  border-radius: 4px;
  background: var(--panel);
  color: var(--ink-soft);
  font: inherit;
  font-size: 0.74rem;
  padding: 4px 6px;
  cursor: pointer;
}

.step-status-select.status-done{ color: var(--done); border-color: var(--done); }
.step-status-select.status-in-progress{ color: var(--on-track); border-color: var(--on-track); }
.step-status-select.status-blocked{ color: var(--blocked); border-color: var(--blocked); }
.step-status-select.status-not-started{ color: var(--ink-soft); }

.step-name{ flex: 1; min-width: 0; }
.step.status-done .step-name{ color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--hairline); }

.step-quarter{
  font-size: 0.76rem;
  color: var(--ink-soft);
  flex-shrink: 0;
}

footer{
  margin-top: 40px;
  font-size: 0.78rem;
  color: var(--ink-soft);
  text-align:center;
}

@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; }
}

@media (max-width: 640px){
  .wrap{ padding: 32px 18px 60px; }
  h1{ font-size: 1.9rem; }
  .rail-track{ grid-template-columns: repeat(2, 1fr); row-gap: 20px; }
  .rail-quarter:nth-child(2), .rail-quarter:nth-child(4){ border-left: none; }
  .goal-head{ flex-wrap: wrap; }
  .goal-head-right{ width: 100%; justify-content: space-between; }
  .summary-row{ grid-template-columns: 1fr; }
  .summary-group-stats{ gap: 10px; }
  .summary-stat .num{ font-size: 1.65rem; }
  .summary-stat .label{ font-size: 0.72rem; }
  .edit-toolbar{ align-items:flex-start; flex-direction:column; }
  .edit-toolbar-actions{ width:100%; }
  .edit-button{ flex:1; }
  .comment-form{ grid-template-columns: 1fr; }
  .comment-form textarea{ grid-column: auto; }
  .comments-heading{ align-items:flex-start; flex-direction:column; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow-row">
      <h1 id="page-title">Goals roadmap</h1>
      <div class="updated" id="updated-line"></div>
    </div>
    <p class="subtitle" id="page-subtitle"></p>
    <div class="summary-row" id="summary-row"></div>
  </header>

  <section class="rail-section">
    <p class="rail-title" id="rail-title">Sub-goals by quarter <span>Click a sub-goal to open its parent goal</span></p>
    <div class="rail-track" id="rail-track">
      <div class="rail-line"></div>
    </div>
  </section>

  <section>
    <div class="edit-toolbar">
      <p class="goals-heading">Goals</p>
      <div class="edit-toolbar-actions">
        <button class="edit-button" id="edit-toggle" type="button">Edit goals &amp; sub-goals</button>
        <button class="edit-button secondary" id="edit-cancel" type="button" hidden>Cancel</button>
        <button class="edit-button" id="edit-save" type="button" hidden>Save changes</button>
      </div>
    </div>
    <div id="goals-list"></div>
  </section>

  <section class="comments-section">
    <div class="comments-heading">
      <h2>Comments and updates</h2>
      <span>Capture context for your 1:1s</span>
    </div>
    <form class="comment-form" id="comment-form">
      <select class="edit-select" id="comment-goal" aria-label="Goal this comment relates to"></select>
      <input class="edit-field" id="comment-date" type="date" aria-label="Comment date">
      <textarea class="edit-field" id="comment-text" placeholder="Write an update, decision, risk, or next step..." aria-label="Comment"></textarea>
      <button class="edit-button" type="submit">Add comment</button>
    </form>
    <div class="comments-list" id="comments-list"></div>
  </section>

  <footer>Updates are saved in this browser. Use Edit goals to maintain the roadmap from the page.</footer>
</div>

<script>
(function(){
  const STATUS_LABEL = {
    "on-track": "On track",
    "in-progress": "In progress",
    "at-risk": "At risk",
    "blocked": "Blocked",
    "done": "Done"
  };

  const STEP_STATUS_LABEL = {
    "not-started": "Not started",
    "in-progress": "In progress",
    "blocked": "Blocked",
    "done": "Done"
  };

  function normalizedStatus(status){
    return status === 'in progress' ? 'in-progress' : status === 'not started' ? 'not-started' : status;
  }

  function normalizedGoalStatus(status){
    if(status === 'in progress' || status === 'in-progress') return 'on-track';
    return status === 'not started' ? 'not-started' : status;
  }

  const GOALS_STORAGE_KEY = 'engineering-goals-data';
  const UPDATED_STORAGE_KEY = 'engineering-goals-last-updated';
  try {
    const savedGoals = JSON.parse(localStorage.getItem(GOALS_STORAGE_KEY) || 'null');
    if(Array.isArray(savedGoals)) DASHBOARD.goals = savedGoals;
  } catch(error) {}
  DASHBOARD.goals.forEach(goal => { goal.status = normalizedGoalStatus(goal.status); });

  const STORAGE_KEY = 'engineering-goals-progress';
  let savedProgress = {};
  try { savedProgress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(error) { savedProgress = {}; }
  DASHBOARD.goals.forEach(goal => {
    const savedSteps = savedProgress[slug(goal.name)];
    if(savedSteps) goal.steps.forEach((step, index) => {
      if(savedSteps[index]) step.status = savedSteps[index];
    });
  });

  document.getElementById('page-title').textContent = DASHBOARD.title;
  document.getElementById('page-subtitle').textContent = DASHBOARD.subtitle;
  const updatedLine = document.getElementById('updated-line');
  function formatUpdatedDate(date = new Date()){
    return new Intl.DateTimeFormat('en', { day: 'numeric', month: 'short', year: 'numeric' }).format(date);
  }

  const currentUpdated = formatUpdatedDate();
  localStorage.setItem(UPDATED_STORAGE_KEY, currentUpdated);
  updatedLine.textContent = `Updated ${currentUpdated}`;

  function markUpdated(){
    const updated = formatUpdatedDate();
    localStorage.setItem(UPDATED_STORAGE_KEY, updated);
    updatedLine.textContent = `Updated ${updated}`;
  }

  function pctForGoal(goal){
    if(!goal.steps || goal.steps.length === 0) return goal.status === 'done' ? 100 : 0;
    const done = goal.steps.filter(s => normalizedStatus(s.status) === 'done').length;
    return Math.round((done / goal.steps.length) * 100);
  }

  const summaryRow = document.getElementById('summary-row');
  function renderSummary(){
    const counts = { 'on-track':0, 'at-risk':0, 'blocked':0, 'done':0, 'not-started':0 };
    let subGoalCount = 0;
    let subGoalsInProgress = 0;
    let subGoalsDone = 0;
    DASHBOARD.goals.forEach(goal => {
      counts[normalizedGoalStatus(goal.status)]++;
      (goal.steps || []).forEach(step => {
        subGoalCount++;
        if(normalizedStatus(step.status) === 'in-progress') subGoalsInProgress++;
        if(normalizedStatus(step.status) === 'done') subGoalsDone++;
      });
    });

    const healthDefs = [
      ['on-track', 'On track', counts['on-track']],
      ['at-risk', 'At risk', counts['at-risk']],
      ['blocked', 'Blocked', counts['blocked']],
      ['done', 'Done', counts['done']],
      ['not-started', 'Not started', counts['not-started']]
    ];
    const progressDefs = [
      ['sub-goals', 'Sub-goals', subGoalCount],
      ['sub-goals-in-progress', 'Sub-goals in progress', subGoalsInProgress],
      ['sub-goals-done', 'Sub-goals done', subGoalsDone]
    ];
    summaryRow.innerHTML = '';
    [['health', 'Goal health', healthDefs], ['progress', 'Sub-goal progress', progressDefs]].forEach(([groupClass, groupLabel, definitions]) => {
      const group = document.createElement('div');
      group.className = `summary-group ${groupClass}`;
      group.innerHTML = `<div class="summary-group-label">${groupLabel}</div><div class="summary-group-stats"></div>`;
      const stats = group.querySelector('.summary-group-stats');
      definitions.forEach(([key, label, count]) => {
        const el = document.createElement('div');
        el.className = `summary-stat ${key}`;
        el.innerHTML = `<div class="num">${count}</div><div class="label">${label}</div>`;
        stats.appendChild(el);
      });
      summaryRow.appendChild(group);
    });
  }
  renderSummary();

  // ---- Quarterly rail ----
  const railTrack = document.getElementById('rail-track');
  QUARTERS.forEach(q => {
    const col = document.createElement('div');
    col.className = 'rail-quarter';

    const label = document.createElement('div');
    label.className = 'quarter-label';
    const quarterSubGoals = DASHBOARD.goals.flatMap(goal => (goal.steps || []).filter(step => step.quarter === q).map(step => ({ goal, step })));
    label.innerHTML = `${q}<span class="quarter-count">${quarterSubGoals.length} ${quarterSubGoals.length === 1 ? 'sub-goal' : 'sub-goals'}</span>`;
    col.appendChild(label);

    const stopsWrap = document.createElement('div');
    stopsWrap.className = 'rail-stops-wrap';

    quarterSubGoals.forEach(({ goal, step }) => {
      const stop = document.createElement('div');
      const stepStatus = normalizedStatus(step.status);
      stop.className = `rail-stop status-${stepStatus}`;
      stop.title = `${step.name} · ${goal.name} · ${STEP_STATUS_LABEL[stepStatus]}`;
      stop.innerHTML = `<span class="dot"></span><span class="stop-info"><span class="name">${step.name}</span></span>`;
      stop.addEventListener('click', () => {
        const card = document.getElementById('goal-' + slug(goal.name));
        if(card){
          card.classList.add('open');
          card.querySelector('.goal-body').style.maxHeight = card.querySelector('.steps-list').scrollHeight + 'px';
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
      stopsWrap.appendChild(stop);
    });

    col.appendChild(stopsWrap);
    railTrack.appendChild(col);
  });

  function slug(str){
    return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function saveProgress(){
    const progress = {};
    DASHBOARD.goals.forEach(goal => {
      progress[slug(goal.name)] = goal.steps.map(step => normalizedStatus(step.status));
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }

  // ---- Goal cards and editor ----
  const goalsList = document.getElementById('goals-list');
  const editToggle = document.getElementById('edit-toggle');
  const editCancel = document.getElementById('edit-cancel');
  const editSave = document.getElementById('edit-save');
  let editing = false;
  let draftGoals;

  function cloneGoals(goals){ return JSON.parse(JSON.stringify(goals)); }

  function optionMarkup(options, selected){
    return options.map(option => `<option value="${option}" ${option === selected ? 'selected' : ''}>${option}</option>`).join('');
  }

  function renderGoals(){
    goalsList.innerHTML = '';
    const goals = editing ? draftGoals : DASHBOARD.goals;
    goals.forEach((goal, goalIndex) => {
      const pct = pctForGoal(goal);
      const goalStatus = normalizedGoalStatus(goal.status);
      const card = document.createElement('div');
      card.className = `goal-card status-${goalStatus}`;
      card.id = 'goal-' + slug(goal.name);

      if(editing){
        card.innerHTML = `
          <div class="goal-head">
            <div class="goal-head-left">
              <input class="edit-field goal-name-input" data-field="name" value="${goal.name.replace(/"/g, '&quot;')}" aria-label="Goal name">
              <div class="goal-meta">
                <select class="edit-select" data-field="status" aria-label="Goal status">${optionMarkup(['not-started', 'on-track', 'at-risk', 'blocked', 'done'], goalStatus)}</select>
                <select class="edit-select" data-field="quarter" aria-label="Target quarter">${optionMarkup(QUARTERS, goal.quarter)}</select>
              </div>
            </div>
            <div class="goal-head-right"><div class="progress-pct">${pct}% · ${goal.steps.filter(s => normalizedStatus(s.status) === 'done').length}/${goal.steps.length} milestones</div></div>
          </div>
          <div class="goal-body open" style="max-height: none;"><div class="steps-list">
            <div class="editor-section-label">Sub-goals / milestones</div>
            ${goal.steps.map((step, stepIndex) => `
              <div class="step edit-milestone">
                <input class="edit-field step-name" data-step-index="${stepIndex}" data-field="name" value="${step.name.replace(/"/g, '&quot;')}" aria-label="Milestone name">
                <select class="edit-select" data-step-index="${stepIndex}" data-field="status" aria-label="Milestone status">${optionMarkup(['not-started', 'in-progress', 'blocked', 'done'], normalizedStatus(step.status))}</select>
                <select class="edit-select" data-step-index="${stepIndex}" data-field="quarter" aria-label="Milestone quarter">${optionMarkup(QUARTERS, step.quarter)}</select>
                <button class="remove-step" data-step-index="${stepIndex}" type="button">Remove</button>
              </div>
            `).join('')}
            <button class="add-step" data-goal-index="${goalIndex}" type="button">+ Add milestone</button>
          </div></div>
        `;
      } else {
        card.innerHTML = `
          <div class="goal-head"><div class="goal-head-left"><div class="goal-name">${goal.name}</div><div class="goal-meta"><select class="edit-select goal-status-select status-${goalStatus}" aria-label="Status for ${goal.name}">${optionMarkup(['not-started', 'on-track', 'at-risk', 'blocked', 'done'], goalStatus)}</select><span>Target ${goal.quarter}</span></div></div>
            <div class="goal-head-right"><div class="progress-mini"><div class="progress-track"><div class="progress-fill" style="width:${pct}%; background: var(--${goalStatus === 'not-started' ? 'hairline' : goalStatus});"></div></div><div class="progress-pct">${pct}% · ${goal.steps.filter(s => normalizedStatus(s.status) === 'done').length}/${goal.steps.length} milestones</div></div><div class="chevron"></div></div>
          </div>
          <div class="goal-body"><div class="steps-list">${goal.steps.map((step, index) => `<div class="step status-${normalizedStatus(step.status)}"><div class="step-check"></div><div class="step-name">${step.name}</div><select class="step-status-select status-${normalizedStatus(step.status)}" data-step-index="${index}" aria-label="Status for ${step.name}">${optionMarkup(['not-started', 'in-progress', 'blocked', 'done'], normalizedStatus(step.status))}</select><div class="step-quarter">${step.quarter}</div></div>`).join('')}</div></div>
        `;
      }

      if(!editing){
        const head = card.querySelector('.goal-head');
        head.addEventListener('click', () => { const body = card.querySelector('.goal-body'); const isOpen = card.classList.toggle('open'); body.style.maxHeight = isOpen ? card.querySelector('.steps-list').scrollHeight + 'px' : '0px'; });
        const goalStatusSelect = card.querySelector('.goal-status-select');
        goalStatusSelect.addEventListener('click', event => event.stopPropagation());
        goalStatusSelect.addEventListener('change', event => { goal.status = event.target.value; localStorage.setItem(GOALS_STORAGE_KEY, JSON.stringify(DASHBOARD.goals)); markUpdated(); location.reload(); });
        card.querySelectorAll('.step-status-select').forEach(select => select.addEventListener('change', event => { goal.steps[Number(event.target.dataset.stepIndex)].status = event.target.value; localStorage.setItem(GOALS_STORAGE_KEY, JSON.stringify(DASHBOARD.goals)); markUpdated(); renderSummary(); renderGoals(); }));
      } else {
        card.querySelectorAll('[data-field]').forEach(field => field.addEventListener('input', event => { const index = Number(event.target.dataset.stepIndex); const target = Number.isNaN(index) ? goal : goal.steps[index]; target[event.target.dataset.field] = event.target.value; }));
        card.querySelectorAll('.remove-step').forEach(button => button.addEventListener('click', () => { goal.steps.splice(Number(button.dataset.stepIndex), 1); renderGoals(); }));
        card.querySelector('.add-step').addEventListener('click', () => { goal.steps.push({ name: 'New milestone', status: 'not-started', quarter: goal.quarter }); renderGoals(); });
      }
      goalsList.appendChild(card);
    });
  }

  function setEditing(value){
    editing = value;
    editToggle.hidden = value;
    editCancel.hidden = !value;
    editSave.hidden = !value;
    draftGoals = value ? cloneGoals(DASHBOARD.goals) : null;
    renderGoals();
  }

  const COMMENTS_STORAGE_KEY = 'engineering-goals-comments';
  const commentForm = document.getElementById('comment-form');
  const commentGoal = document.getElementById('comment-goal');
  const commentDate = document.getElementById('comment-date');
  const commentText = document.getElementById('comment-text');
  const commentsList = document.getElementById('comments-list');
  let comments = [];
  try { comments = JSON.parse(localStorage.getItem(COMMENTS_STORAGE_KEY) || '[]'); } catch(error) { comments = []; }

  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
  }

  function renderCommentGoals(){
    const selected = commentGoal.value;
    commentGoal.innerHTML = DASHBOARD.goals.map(goal => `<option value="${escapeHtml(goal.name)}">${escapeHtml(goal.name)}</option>`).join('');
    if(DASHBOARD.goals.some(goal => goal.name === selected)) commentGoal.value = selected;
  }

  function renderComments(){
    renderCommentGoals();
    if(!comments.length){
      commentsList.innerHTML = '<div class="comments-empty">No comments yet. Add the first update above.</div>';
      return;
    }
    commentsList.innerHTML = comments.slice().reverse().map(comment => `
      <article class="comment-entry">
        <div class="comment-meta"><span class="comment-related">${escapeHtml(comment.goal)}</span><span>${escapeHtml(comment.date)}</span></div>
        <div class="comment-text">${escapeHtml(comment.text)}</div>
        <div class="comment-actions"><button type="button" data-comment-action="delete" data-comment-id="${comment.id}">Delete</button></div>
      </article>
    `).join('');
    commentsList.querySelectorAll('[data-comment-action="delete"]').forEach(button => button.addEventListener('click', () => {
      comments = comments.filter(comment => String(comment.id) !== button.dataset.commentId);
      localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(comments));
      markUpdated();
      renderComments();
    }));
  }

  commentDate.value = new Date().toISOString().slice(0, 10);
  commentForm.addEventListener('submit', event => {
    event.preventDefault();
    const text = commentText.value.trim();
    if(!text) return;
    comments.push({ id: Date.now(), goal: commentGoal.value, date: commentDate.value, text });
    localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(comments));
    markUpdated();
    commentText.value = '';
    commentDate.value = new Date().toISOString().slice(0, 10);
    renderComments();
  });

  editToggle.addEventListener('click', () => setEditing(true));
  editCancel.addEventListener('click', () => setEditing(false));
  editSave.addEventListener('click', () => {
    DASHBOARD.goals = cloneGoals(draftGoals);
    localStorage.setItem(GOALS_STORAGE_KEY, JSON.stringify(DASHBOARD.goals));
    markUpdated();
    setEditing(false);
    location.reload();
  });

  renderGoals();
  renderComments();
})();
</script>

</body>
</html>
